<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Build: AI products end to end. Research: machine learning and AI systems, published in IEEE Access. Record: CGPA 3.90, hackathon winner.">
<style>
.tag{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;fill:#8b949e}
.hd{font:700 32px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:-1.2px;fill:#e6edf3}
.bd{font:400 16.5px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
.card{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
